<!DOCTYPE html>
<html>
<head>
    <title>JWT Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input, button {
            margin: 5px;
            padding: 10px;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🔐 JWT Authentication Test</h1>

    <div class="test-section">
        <h2>1. Test Login</h2>
        <input type="email" id="email" placeholder="Email" value="test@example.com">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="testLogin()">Login</button>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Check localStorage</h2>
        <button onclick="checkToken()">Check Token</button>
        <div id="tokenResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Protected Route</h2>
        <button onclick="testProtectedRoute()">Test /auth/me</button>
        <div id="protectedResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. Clear Token</h2>
        <button onclick="clearToken()">Clear localStorage</button>
    </div>

    <script>
        const API_URL = 'http://localhost:5001/api';

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');

            try {
                console.log('🔐 Testing login...');
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                console.log('📥 Response:', data);

                if (data.success && data.token) {
                    console.log('✅ Token received:', data.token.substring(0, 20) + '...');
                    localStorage.setItem('token', data.token);
                    console.log('💾 Token stored in localStorage');
                    
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Login successful!
Token: ${data.token.substring(0, 30)}...
User: ${data.user.email}
Check localStorage now!`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Login failed: ${data.message}`;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        function checkToken() {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('tokenResult');

            if (token) {
                resultDiv.className = 'result success';
                resultDiv.textContent = `✅ Token found in localStorage!
Token: ${token.substring(0, 50)}...
Length: ${token.length} characters`;
            } else {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found in localStorage';
            }
        }

        async function testProtectedRoute() {
            const token = localStorage.getItem('token');
            const resultDiv = document.getElementById('protectedResult');

            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found. Please login first.';
                return;
            }

            try {
                console.log('🔒 Testing protected route...');
                const response = await fetch(`${API_URL}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                console.log('📥 Response:', data);

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Protected route works!
User: ${data.user.email}
Role: ${data.user.rol}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Failed: ${data.message}`;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        function clearToken() {
            localStorage.removeItem('token');
            console.log('🗑️ Token cleared');
            alert('Token cleared from localStorage');
        }

        // Check token on load
        window.onload = function() {
            checkToken();
        };
    </script>
</body>
</html>
